name: Export V60 Offline Toolchain

on:
  push:
    branches:
      - home-edition-v60
    paths:
      - ".github/workflows/export-v60-toolchain.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android API 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prewarm public dependencies
        shell: bash
        run: |
          cp -a android /tmp/android-prewarm
          sed -i "/play-services-home:/d;/play-services-home-types:/d" /tmp/android-prewarm/app/build.gradle
          cd /tmp/android-prewarm
          gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath >/tmp/v60-dependencies.txt

      - name: Pack and split offline toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/v60-toolchain/android-sdk /tmp/v60-toolchain/gradle /tmp/v60-parts
          cp -a "$SDK_ROOT/platforms/android-36" /tmp/v60-toolchain/android-sdk/
          cp -a "$SDK_ROOT/build-tools/36.0.0" /tmp/v60-toolchain/android-sdk/
          cp -a "$SDK_ROOT/platform-tools" /tmp/v60-toolchain/android-sdk/
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_HOME="$(dirname "$(dirname "$GRADLE_BIN")")"
          cp -a "$GRADLE_HOME" /tmp/v60-toolchain/gradle/gradle-8.11.1
          cp -a "$HOME/.gradle/caches" /tmp/v60-toolchain/gradle-caches
          cp /tmp/v60-dependencies.txt /tmp/v60-toolchain/
          tar -C /tmp -czf /tmp/v60-offline-toolchain.tar.gz v60-toolchain
          split -b 70M -d -a 2 /tmp/v60-offline-toolchain.tar.gz /tmp/v60-parts/part-
          ls -lh /tmp/v60-parts

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with: { name: v60-toolchain-part-00, path: /tmp/v60-parts/part-00, if-no-files-found: ignore, retention-days: 3 }
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with: { name: v60-toolchain-part-01, path: /tmp/v60-parts/part-01, if-no-files-found: ignore, retention-days: 3 }
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with: { name: v60-toolchain-part-02, path: /tmp/v60-parts/part-02, if-no-files-found: ignore, retention-days: 3 }
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with: { name: v60-toolchain-part-03, path: /tmp/v60-parts/part-03, if-no-files-found: ignore, retention-days: 3 }
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with: { name: v60-toolchain-part-04, path: /tmp/v60-parts/part-04, if-no-files-found: ignore, retention-days: 3 }
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with: { name: v60-toolchain-part-05, path: /tmp/v60-parts/part-05, if-no-files-found: ignore, retention-days: 3 }
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with: { name: v60-toolchain-part-06, path: /tmp/v60-parts/part-06, if-no-files-found: ignore, retention-days: 3 }
      - name: Upload part 07
        uses: actions/upload-artifact@v4
        with: { name: v60-toolchain-part-07, path: /tmp/v60-parts/part-07, if-no-files-found: ignore, retention-days: 3 }
