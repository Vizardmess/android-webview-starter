      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Fix permissions & line endings (Gradle wrapper)
        run: |
          cd android
          sed -i 's/\r$//' gradlew || true
          sed -i 's/\r$//' gradlew.d/gradlew-real || true
          chmod +x gradlew gradlew.d/gradlew-real

      - name: Build APK (Debug)
        run: |
          cd android
          sh ./gradlew --no-daemon :app:assembleDebug --stacktrace --info

      - name: List outputs
        run: |
          find android/app/build/outputs -maxdepth 4 -type f -printf "%p\n" | sort || true
          ls -lah android/app/build/outputs/apk/debug || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
