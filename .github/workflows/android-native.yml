name: Android Native — Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]   # se a tua branch não for "main", muda aqui

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

            - name: Fix permissions & line endings (Gradle wrapper)
        run: |
          cd android
          # normaliza EOL (evita \r\n)
          sed -i 's/\r$//' gradlew || true
          sed -i 's/\r$//' gradlew.d/gradlew-real || true
          # garante permissão de execução
          chmod +x gradlew gradlew.d/gradlew-real

      - name: Build APK (Debug)
        run: |
          cd android
          # usa sh para não depender do bit de execução do shebang em ambientes restritos
          sh ./gradlew --no-daemon :app:assembleDebug --stacktrace --info


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
