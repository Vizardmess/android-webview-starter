name: Home Edition V60 Google Home APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout V60
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android API 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Check Google Home SDK
        shell: bash
        run: |
          HOME_AAR="$HOME/.m2/repository/com/google/android/gms/play-services-home/17.1.0/play-services-home-17.1.0.aar"
          TYPES_AAR="$HOME/.m2/repository/com/google/android/gms/play-services-home-types/17.1.0/play-services-home-types-17.1.0.aar"
          if [ ! -f "$HOME_AAR" ] || [ ! -f "$TYPES_AAR" ]; then
            echo "::error::Google Home SDK is not in the runner Maven repository."
            echo "::error::The official Home APIs SDK must be downloaded while signed in to Google Home Developers and installed into ~/.m2/repository before this build can run."
            exit 2
          fi

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Home Edition V60
        run: |
          cd android
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare named APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Home_Edition_V60_debug.apk
          sha256sum dist/Home_Edition_V60_debug.apk | tee dist/Home_Edition_V60_debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Home_Edition_V60_debug
          path: |
            dist/Home_Edition_V60_debug.apk
            dist/Home_Edition_V60_debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
