name: Home Edition V58 APK

on:
  push:
    branches:
      - home-edition-v58
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout V58
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android API 34
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          "$SDKMANAGER" --list_installed | grep -E "platforms;android-34|build-tools;34.0.0|platform-tools"

      - name: Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build Home Edition V58
        run: |
          cd android
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare named APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Home_Edition_V58_debug.apk
          sha256sum dist/Home_Edition_V58_debug.apk | tee dist/Home_Edition_V58_debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Home_Edition_V58_debug
          path: |
            dist/Home_Edition_V58_debug.apk
            dist/Home_Edition_V58_debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
