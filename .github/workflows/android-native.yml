name: Android Native — Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]   # se a tua branch não for "main", muda aqui

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x ./gradlew || true
          ./gradlew --no-daemon :app:assembleDebug --stacktrace --info

      - name: List outputs
        run: |
          find android/app/build/outputs -maxdepth 4 -type f -printf "%p\n" | sort || true
          ls -lah android/app/build/outputs/apk/debug || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
